name: Consorcio Cache Warmup

on:
  schedule:
    - cron: '0 * * * *' # Run every hour at minute 0
  workflow_dispatch: # Allow manual trigger

jobs:
  warmup:
    runs-on: ubuntu-latest
    steps:
      - name: Call Warmup Endpoint
        run: |
          curl -f -X GET https://gaditan.pages.dev/api/warmup
